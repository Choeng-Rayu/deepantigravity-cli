      - heading "Call for Volunteers of Cambodia ICT Camp 2026" [level=1] [ref=e35]
    - generic [ref=e37]:
      - generic [ref=e38]: The Cambodia ICT Camp 2026 will convene on 19-20 September 2026 in Siem Reap province
      - text: following its regular two-year cycle! Similar to its previous editions, this dynamic and participatory camp will provide a collaborative platform for both the speakers and participants to meet, share, and reflect the digital future of Cambodia and Mekong region.
      - text: The Camp will be attended by diverse participants, working in the fields of open data, media and journalism, artificial intelligence (AI), online safety, digital rights, and research and advocacy. They will have the opportunity to engage in an in-depth learning provided by the national and international experts and get to experience the real-life applications of technologies while connecting with like-minded community.
      - generic [ref=e39]: The organizing committee is opening the opportunity for 5-10 Cambodian students or youths to join us as the volunteers and become part of the organizing committee for the Cambodia ICT Camp 2026. With closed guidance from the organizing committee, the volunteers will assist with facilitating national and international speakers, providing logistical and media supports, and contributing to blog post and camp report.
      - generic [ref=e40]: "To be eligible for the volunteers of this camp, applicants must meet the criteria as following:"
      - list [ref=e41]:
        - listitem [ref=e42]:
          - generic [ref=e43]: Be Cambodian university students or youths with educational backgrounds in media, communications, data science, tourism, hospitality, ICT, AI, or other related fields.
        - listitem [ref=e44]: Currently seeking volunteering opportunity to develop skills and gain hands-on experience relevant to their educational background.
        - listitem [ref=e45]: Demonstrate strong support for the objectives and values of the Camp.
        - listitem [ref=e46]: Committed to fulfilling assigned tasks throughout the Camp as a team and in collaboration with the organizing committee.
        - listitem [ref=e47]: Be able to perform the volunteering role for a period of three months from July 2026 - September 2026.
        - listitem [ref=e48]: Be able to participate fully in orientation session on the Camp, knowledge-sharing sessions, preparation meetings, and the event day.
        - listitem [ref=e49]: Be able to communicate in English.
        - listitem [ref=e50]: Have access to a personal computer.
      - text: Volunteers will receive a certificate of recognition and small incentive in appreciation for their commitment and contribution in the Camp, in addition to gaining skill development, hands-on experiences, and networking opportunities throughout the camp.
      - text: Please do not miss this valuable opportunity if you meet the selection criteria! The application deadline is Monday, 15 June 2026 at 23:59 (Indochina time). Only shortlisted candidates will be contacted for a group interview.
      - text: "Privacy Notice: all information will be treated confidentially and used solely for selection purposes."
      - text: "Should you have any questions, please reach out to the Secretariat Team via this email:"
      - link "event@cambodiaict.net" [ref=e52] [cursor=pointer]:
        - /url: mailto:event@cambodiaict.net
